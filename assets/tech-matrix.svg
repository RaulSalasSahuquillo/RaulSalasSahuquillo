<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 148" width="100%" height="148" fill="none">
  <defs>
    <style>
      .card-index {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #7d8590;
        letter-spacing: 1px;
      }
      .card-heading {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        fill: #ffffff;
        letter-spacing: -0.2px;
      }
      .card-bullet {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 10.5px;
        fill: #8b949e;
        line-height: 1.6;
      }
      .top-sheen {
        stroke: #30363d;
        stroke-width: 1;
      }
      @keyframes cardBorderHover {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      .hairline-accent {
        animation: cardBorderHover 5s ease-in-out infinite;
      }
    </style>
    <linearGradient id="matCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Systems & Core -->
  <g transform="translate(15, 8)">
    <rect width="192" height="132" rx="6" fill="url(#matCardBg)" stroke="#21262d" stroke-width="1"/>
    <line class="hairline-accent" x1="16" y1="0" x2="80" y2="0" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
    <text class="card-index" x="16" y="24">01 // SYSTEMS</text>
    <text class="card-heading" x="16" y="44">Core &amp; Low-Level</text>
    <text class="card-bullet" x="16" y="68">&#x2022; C &amp; C++ (POSIX)</text>
    <text class="card-bullet" x="16" y="88">&#x2022; Shell, Bash &amp; Zsh</text>
    <text class="card-bullet" x="16" y="108">&#x2022; Reverse Engineering</text>
  </g>

  <!-- Card 2: Embedded & Industrial Hardware -->
  <g transform="translate(223, 8)">
    <rect width="192" height="132" rx="6" fill="url(#matCardBg)" stroke="#21262d" stroke-width="1"/>
    <line class="hairline-accent" x1="16" y1="0" x2="80" y2="0" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
    <text class="card-index" x="16" y="24">02 // EMBEDDED</text>
    <text class="card-heading" x="16" y="44">Firmware &amp; IoT</text>
    <text class="card-bullet" x="16" y="68">&#x2022; ESP32 &amp; Arduino Uno</text>
    <text class="card-bullet" x="16" y="88">&#x2022; Non-blocking State I/O</text>
    <text class="card-bullet" x="16" y="108">&#x2022; Industrial Hydroponics</text>
  </g>

  <!-- Card 3: Applied AI & Vision -->
  <g transform="translate(431, 8)">
    <rect width="192" height="132" rx="6" fill="url(#matCardBg)" stroke="#21262d" stroke-width="1"/>
    <line class="hairline-accent" x1="16" y1="0" x2="80" y2="0" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
    <text class="card-index" x="16" y="24">03 // INTELLIGENCE</text>
    <text class="card-heading" x="16" y="44">Vision &amp; Models</text>
    <text class="card-bullet" x="16" y="68">&#x2022; PyTorch &amp; TensorFlow</text>
    <text class="card-bullet" x="16" y="88">&#x2022; ResNet-34 Architectures</text>
    <text class="card-bullet" x="16" y="108">&#x2022; Astronomical Survey AI</text>
  </g>

  <!-- Card 4: Multiplatform & Web Structure -->
  <g transform="translate(639, 8)">
    <rect width="196" height="132" rx="6" fill="url(#matCardBg)" stroke="#21262d" stroke-width="1"/>
    <line class="hairline-accent" x1="16" y1="0" x2="80" y2="0" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
    <text class="card-index" x="16" y="24">04 // RUNTIMES</text>
    <text class="card-heading" x="16" y="44">Web &amp; Cross-Platform</text>
    <text class="card-bullet" x="16" y="68">&#x2022; Flutter &amp; Dart</text>
    <text class="card-bullet" x="16" y="88">&#x2022; HTML5 · CSS3 · JS</text>
    <text class="card-bullet" x="16" y="108">&#x2022; WebAssembly &amp; SQL</text>
  </g>
</svg>